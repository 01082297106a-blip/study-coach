function calc(){let s=Array(9).fill(0),c=Array(9).fill(0);Q.forEach((q,n)=>{s[q[0]]+=A[n];c[q[0]]++});return s.map((v,n)=>Math.round(v/(c[n]*3)*100))}

function renderResult(){let x=data();$('#resultEye').textContent=zh?'我的学习分析':'나의 학습 분석';$('#headline').textContent=(zh?'现在最先改变：':'지금 가장 먼저 바꿀 것: ')+T(D[x.lo]);$('#summary').textContent=zh?`你的第一改善领域是“${T(D[x.lo])}”，第二是“${T(D[x.lo2])}”。下面不是评价你的能力，而是决定考试前两周最值得改变的学习行为。`:`1순위 개선 영역은 ‘${T(D[x.lo])}’, 2순위는 ‘${T(D[x.lo2])}’입니다. 능력을 평가하는 것이 아니라 시험 전 2주 동안 가장 먼저 바꿀 학습행동을 찾은 결과예요.`;$('#weakL').textContent=zh?'优先改善':'우선 개선';$('#weak').textContent=T(D[x.lo])+' → '+T(D[x.lo2]);$('#strongL').textContent=zh?'我的优势':'현재 강점';$('#strong').textContent=T(D[x.hi]);$('#interpretT').textContent=zh?'我的结果是什么意思？':'내 결과는 무슨 뜻일까?';$('#interpret').innerHTML=interpretation(x).map(v=>`<div class="feedback">${v}</div>`).join('');$('#scoreT').textContent=zh?'9项学习习惯':'9개 학습습관';$('#scores').innerHTML=x.S.map((v,n)=>`<div class="score"><div class="row"><span>${T(D[n])}</span><b>${v}%</b></div><div class="meter"><div style="width:${v}%"></div></div></div>`).join('');$('#missionT').textContent=zh?'选择我的7天行动任务':'나의 7일 실천미션 고르기';$('#missionHelp').textContent=zh?'根据你的第一、第二改善领域推荐了6个任务。请选择真正能做到的2个。':'1·2순위 개선영역에 맞춰 6개를 추천했어요. 욕심내지 말고 정말 할 수 있는 것 2개만 고르세요.';selected=[];let list=[...M[x.lo].map((m,n)=>({id:x.lo+'-'+n,m})),...M[x.lo2].map((m,n)=>({id:x.lo2+'-'+n,m}))];$('#missions').innerHTML='';list.forEach(z=>{let l=document.createElement('label');l.className='mission';let c=document.createElement('input');c.type='checkbox';let sp=document.createElement('span');sp.textContent=T(z.m);c.onchange=()=>{if(c.checked&&selected.length>=2){c.checked=false;alert(zh?'只选2个任务。':'실천미션은 2개만 골라주세요.');return}if(c.checked)selected.push(z);else selected=selected.filter(a=>a.id!==z.id);l.classList.toggle('sel',c.checked)};l.append(c,sp);$('#missions').append(l)});$('#makeCard').textContent=zh?'制作我的D-7任务卡':'나의 D-7 미션카드 만들기';$('#cardTag').textContent=zh?'未来7天':'앞으로 7일';$('#cardTitle').textContent=zh?'我的D-7学习任务':'나의 D-7 공부 미션';$('#promiseL').textContent=zh?'我想补充的约定（可选）':'내가 추가로 정할 약속 (선택)';$('#promise').placeholder=zh?'例：晚上8点开始':'예:
